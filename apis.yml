aid: sakura-internet
name: SAKURA internet
description: SAKURA internet Inc. (さくらインターネット株式会社) is a Japanese internet infrastructure company operating data centers and offering hosting,
  domain, SSL, CDN, IoT and cloud services. Its flagship IaaS, SAKURA Cloud (さくらのクラウド), provides servers, GPU and confidential VMs, disks, object
  storage, load balancers, AppRun, KMS and secrets management, all controllable through the SAKURA Cloud REST API (v1.1) documented in its API
  portal, with open-source SDKs, Terraform provider and tooling published on GitHub under the sacloud organization.
