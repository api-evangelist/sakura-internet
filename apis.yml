apis:
- name: SAKURA Cloud API 1.1
  description: >-
    さくらのクラウドAPI1.1: the core SAKURA Cloud IaaS REST API for operating servers, disks, ISO images, bridges,
    routers, interfaces, appliances, icons, scripts, SSH keys, facilities, products, users/projects and
    billing outside the control panel, authenticated with API keys issued in the control panel; served
    per zone (tk1a, tk1b, is1a, is1b, is1c). No machine-readable contract is published for it; documentation
    is HTML.
