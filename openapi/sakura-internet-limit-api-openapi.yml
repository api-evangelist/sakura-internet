openapi: 3.2.0
info:
  title: AppRun専有型 Limit API
  version: 1.4.0
  contact:
    name: SAKURA internet Inc.
  license:
    name: Copyright(C) SAKURA internet Inc. all rights reserved.
  description: '# 更新履歴


    - 2026-07-29 (v1.4.0): クラスタのロードバランサ設定取得・更新エンドポイントを追加

    - 2026-07-15 (v1.3.1): Response samplesを修正


    ---


    「AppRun専有型」が提供する API の利用方法とサンプルを公開しています。


    # 基本的な使い方


    ## APIキーの発行


    API を利用するには、認証用の「APIキー」が必要です。事前にキーを発行してください。\

    APIキーは、「ユーザーID」「パスワード」に相当する「トークン」と呼ばれる認証情報で構成されています。


    | 項目名 | APIキー発行時の項目名 | このドキュメント内での例 |

    |--------|----------------------|--------------------------|

    | ユーザーID | アクセストークン (UUID) | 01234567-89ab-cdef-0123-456789abcdef |

    | パスワード | アクセストークンシークレット |…'
servers:
- url: https://secure.sakura.ad.jp/cloud/api/apprun-dedicated/1.0
  description: AppRun専有型 API エンドポイント
  variables: {}
security:
- BasicAuth: []
tags:
- name: limit
paths:
  /limits:
    get:
      operationId: readLimits
      summary: プロジェクトのリソース制限値の取得
      description: プロジェクトに紐づくリソース制限値を返します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadLimitsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - limit
components:
  schemas:
    Limit:
      type: object
      required:
      - clusterCount
      - autoScalingGroupCount
      - workerNodeCount
      - loadBalancerNodeCount
      - applicationCount
      - applicationVersionCountPerApplication
      properties:
        clusterCount:
          type: integer
          format: int64
          description: クラスタの最大数
        autoScalingGroupCount:
          type: integer
          format: int64
          description: オートスケーリンググループの最大数
        workerNodeCount:
          type: integer
          format: int64
          description: ワーカノードの最大数
        loadBalancerNodeCount:
          type: integer
          format: int64
          description: ロードバランサノードの最大数
        applicationCount:
          type: integer
          format: int64
          description: アプリケーションの最大数
        applicationVersionCountPerApplication:
          type: integer
          format: int64
          description: アプリケーションあたりのバージョンの最大数
    Error:
      type: object
      required:
      - status
      - title
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
    ReadLimitsResponse:
      type: object
      required:
      - limit
      properties:
        limit:
          allOf:
          - $ref: '#/components/schemas/Limit'
          description: プロジェクトのリソース制限値
      example:
        limit:
          clusterCount: 10
          autoScalingGroupCount: 6
          workerNodeCount: 14
          loadBalancerNodeCount: 6
          applicationCount: 10
          applicationVersionCountPerApplication: 50
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
externalDocs:
  url: https://manual.sakura.ad.jp/cloud/apprun-dedicated/releasenote.html
  description: リリースノート | さくらのクラウド マニュアル
