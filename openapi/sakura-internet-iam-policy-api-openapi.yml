openapi: 3.2.0
info:
  title: Sakura Internet Iam Policy API
  version: 2.1.0
  contact:
    name: SAKURA internet Inc.
  description: 'Operations tagged iam-policy across 2 of this provider''s published API definitions: iam-api.yaml, sakura-internet-iam-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://secure.sakura.ad.jp/cloud/api/iam/1.0
security:
- ServicePrincipalAuth: []
tags:
- name: iam-policy
  x-displayName: IAMポリシー
  description: IAMポリシーに関する機能
paths:
  /projects/{project_id}/iam-policy:
    parameters:
    - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: readProjectIamPolicy
      tags:
      - iam-policy
      summary: プロジェクトIAMポリシーを取得する
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - bindings
                properties:
                  bindings:
                    type: array
                    items:
                      $ref: '#/components/schemas/IamPolicy'
              example:
                bindings:
                - role:
                    type: preset
                    id: admin
                  principals:
                  - type: user
                    id: 111111111111
                  - type: group
                    id: 1
                  - type: service-principal
                    id: 111111111111
        '401':
          description: 認証情報が無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Unauthorized'
        '403':
          description: アクセス権限がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http403Forbidden'
        '404':
          description: 指定したプロジェクトが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http404NotFound'
        '429':
          description: APIリクエストのレートリミット超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http429TooManyRequests'
    put:
      operationId: updateProjectIamPolicy
      tags:
      - iam-policy
      summary: プロジェクトIAMポリシーを更新する
      requestBody:
        description: プロジェクトIAMポリシーの情報を含んだJSON
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bindings
              properties:
                bindings:
                  type: array
                  items:
                    $ref: '#/components/schemas/IamPolicy'
              example:
                bindings:
                - role:
                    type: preset
                    id: admin
                  principals:
                  - type: user
                    id: 111111111111
                  - type: group
                    id: 1
                  - type: service-principal
                    id: 111111111111
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required:
                - bindings
                properties:
                  bindings:
                    type: array
                    items:
                      $ref: '#/components/schemas/IamPolicy'
        '400':
          description: 不正なリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http400BadRequest'
              examples:
                LowestGrantableResourceInvalid:
                  summary: 付与可能な最低階層を満たしていない
                  value:
                    type: about:blank
                    status: 400
                    title: invalid
                    detail: Invalid input.
                    errors:
                      role:
                      - message: '"folder-admin"はフォルダ階層以上にのみ付与可能です'
                        code: invalid
        '401':
          description: 認証情報が無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http401Unauthorized'
        '403':
          description: アクセス権限がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http403Forbidden'
        '404':
          description: 指定したプロジェクトが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http404NotFound'
        '429':
          description: APIリクエストのレートリミット超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http429TooManyRequests'
        '503':
          description: 一時的な処理エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http503ServiceUnavailable'
    servers:
    - url: https://secure.sakura.ad.jp/cloud/api/iam/1.0
