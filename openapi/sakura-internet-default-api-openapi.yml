            $ref: '#/components/schemas/Name'
            example: routeName
          tags:
            $ref: '#/components/schemas/Tags'
            description: Routeを検索するためのタグ
          protocols:
            type: string
            enum:
            - https
            example: https
            description: Routeにアクセスするためのプロトコル
          path:
            type: string
            example: /
            maxLength: 255
            pattern: ^(\/|~\/).*
            description: Routeにアクセスするためのパス<br>パスはスラッシュまたはチルダスラッシュで始まるパス文字列のみを許可
          host:
            readOnly: true
            type: string
            example: site-XXXXXXXXXXXXXXXX.XXX.apigw.sakura.ne.jp
            description: 自動発行されたホスト<br>hostsに値が設定されていない場合に有効
          hosts:
            type: array
            example:
            - example.com
            - example.jp
            description: ホスト名<br>自動発行されたホストまたは設定したドメインを指定する<br>自動発行されたホストはService詳細照会APIで確認できる<br>作成したドメインはDomain一覧照会APIで確認できる
            items:
              type: string
              description: ホスト名<br>自動発行されたホストまたは設定したドメインを指定する<br>自動発行されたホストはService詳細照会APIで確認できる<br>作成したドメインはDomain一覧照会APIで確認できる
              example:
              - example.com
              - example.jp
          methods:
            type: array
            items:
              $ref: '#/components/schemas/HTTPMethod'
            example:
            - GET
            - POST
            default:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
            - HEAD
            - CONNECT
            - TRACE
            description: RouteにアクセスするためのHTTPメソッド<br>未指定の場合は全メソッドを許可<br>オブジェクトストレージ形式のサービスに紐づく場合は、GET・HEAD・OPTIONSメソッドのみを許可
          httpsRedirectStatusCode:
            type: integer
            enum:
            - 301
            - 302
            - 303
            - 307
            - 308
            - 426
            default: 426
            example: 426
            description: HTTPSリダイレクト時のステータスコード
          regexPriority:
            type: integer
            minimum: 0
            maximum: 255
            default: 0
            example: 0
            description: パスを正規表現で指定した場合の優先度<br>0が最優先
          stripPath:
            type: boolean
            default: true
            example: false
            description: リクエストのパスからルートのパスを削除するかどうか
          preserveHost:
            type: boolean
            default: false
            example: true
            description: リクエストのHostヘッダーを保持するかどうか
          requestBuffering:
            type: boolean
            default: true
            example: false
            description: リクエストのバッファリングを有効にするかどうか
          responseBuffering:
            type: boolean
            default: true
            example: false
            description: レスポンスのバッファリングを有効にするかどうか
      required:
      - name
      - protocols
      - methods
    RouteAuthorizationDetail:
      type: object
      oneOf:
      - type: object
        properties:
          isACLEnabled:
            type: boolean
            enum:
            - false
            description: 認可設定を無効にする
        required:
        - isACLEnabled
      - type: object
        properties:
          isACLEnabled:
            type: boolean
            enum:
            - true
            description: 認可設定を有効にする
          groups:
            type: array
            description: 認可するGroupのリスト
            items:
              $ref: '#/components/schemas/RouteAuthorization'
            minItems: 1
        required:
        - isACLEnabled
        - groups
    IpRestrictionConfig:
      type: object
      description: IP制限
      allOf:
      - properties:
          protocols:
            type: string
            enum:
            - https
            example: https
            description: IP制限を設定するプロトコル
          restrictedBy:
            type: string
            enum:
            - allowIps
            - denyIps
            example: allowIps
            description: IP制限の種別
          ips:
            type: array
            items:
              type: string
              pattern: ^(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}$
            minItems: 1
            example:
            - 192.168.1.1
            - 192.168.1.2
            description: 対象IPアドレス<br>IPアドレスはIPv4のみを許可
        required:
        - protocols
        - restrictedBy
        - ips
    CorsConfig:
      description: CORS設定
      type: object
      allOf:
      - properties:
          credentials:
            type: boolean
            description: ブラウザがクロスオリジンリクエストに対してクレデンシャルを含めるかどうか
            example: false
          accessControlExposedHeaders:
            type: string
            description: ブラウザがアクセス可能なヘッダー
            maxLength: 4000
            example: ''
          accessControlAllowHeaders:
            type: string
            description: クライアントがリクエストに含めることができるヘッダー
            maxLength: 4000
            example: ''
          maxAge:
            type: integer
            description: CORS許可の有効期限
            format: int32
            default: 0
            example: 0
          accessControlAllowMethods:
            type: array
            items:
              $ref: '#/components/schemas/HTTPMethod'
            example:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
            - HEAD
            - CONNECT
            - TRACE
            default:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
            - HEAD
            - CONNECT
            - TRACE
            description: CORS許可メソッド<br>未指定の場合は全メソッドを許可
          accessControlAllowOrigins:
            type: string
            description: CORSで許可するOrigin<br>未指定の場合は全Originを許可
            example: '*'
            maxLength: 4000
          preflightContinue:
            type: boolean
            description: CORSのPreflightリクエストを処理するかどうか
            example: false
          privateNetwork:
            type: boolean
            description: privateNetwork内で動作させるかどうか
            example: false
    HTTPMethod:
      type: string
      description: 変換するHTTPメソッド
      enum:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
      - HEAD
      - CONNECT
      - TRACE
    Service:
      description: Service情報
      type: object
      allOf:
      - $ref: '#/components/schemas/Model'
      - properties:
          name:
            $ref: '#/components/schemas/Name'
            description: Service名<br>Service名は半角英数字およびアンダースコアのみを許可
            example: serviceName
          tags:
            $ref: '#/components/schemas/Tags'
            description: Serviceを検索するためのタグ
          protocol:
            type: string
            description: Serviceにアクセスするためのプロトコル
            enum:
            - http
            - https
            example: https
          host:
            type: string
            description: Serviceにアクセスするためのホスト名<br>ホスト名はドメイン名またはIPアドレスを指定する<br>プライベート/ループバックIPアドレスは指定できない
            maxLength: 253
            pattern: ^((([a-zA-Z\d][a-zA-Z\d-]*[a-zA-Z\d]*\.)+[a-zA-Z]{2,})|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)))$
            example: xxx.example.jp
          path:
            type: string
            maxLength: 255
            pattern: ^\/[a-zA-Z0-9_\-\/!.*'()-]*$
            description: Serviceにアクセスするためのパス<br>パスは/から始まり、半角英数字、アンダースコア、ハイフン、スラッシュ、一部記号（!.*'()-）のみを許可
            example: /base
            default: /
          port:
            type: integer
            minimum: 0
            maximum: 65535
            description: Serviceにアクセスするためのポート番号<br>省略した場合はプロトコルに応じたデフォルトポートが設定される
            example: 80
          retries:
            type: integer
            minimum: 0
            maximum: 32767
            default: 5
            description: リトライ回数
          connectTimeout:
            type: integer
            minimum: 1
            maximum: 2147483646
            default: 60000
            description: 接続タイムアウト秒数
          writeTimeout:
            type: integer
            minimum: 1
            maximum: 2147483646
            default: 60000
            description: 書き込みタイムアウト秒数
          readTimeout:
            minimum: 1
            maximum: 2147483646
            type: integer
            default: 60000
            description: 読み込みタイムアウト秒数
          authentication:
            type: string
            enum:
            - none
            - basic
            - hmac
            - jwt
            - oidc
            default: none
            description: 認証方式<br>未指定の場合は認証なし
          oidc:
            $ref: '#/components/schemas/OidcSummary'
          routeHost:
            type: string
            maxLength: 253
            example: site-xxxxxxxxx.xxx.apigw.sakura.ne.jp
            description: 自動発行したRouteのホスト
            readOnly: true
        required:
        - name
        - protocol
        - host
    JSONKey:
      type: string
      description: JSONのキー<br>半角英数字、ハイフン、アンダースコア、ピリオド繋ぎを許可
      pattern: ^([a-zA-Z0-9_~\-\\\p{L}]+(\.[a-zA-Z0-9_~\-\\\p{L}]+)*)$
      maxLength: 255
    RequestRenameDetail:
      type: object
      properties:
        headers:
          type: array
          items:
            type: object
            properties:
              from:
                $ref: '#/components/schemas/RequestHeaderKey'
              to:
                $ref: '#/components/schemas/RequestHeaderKey'
        queryParams:
          type: array
          items:
            type: object
            properties:
              from:
                $ref: '#/components/schemas/QueryParamKey'
                description: リネームするクエリパラメータのキー
              to:
                $ref: '#/components/schemas/QueryParamKey'
                description: リネーム後のクエリパラメータのキー
        body:
          type: array
          items:
            type: object
            properties:
              from:
                $ref: '#/components/schemas/JSONKey'
                description: リネームするボディのキー
              to:
                $ref: '#/components/schemas/JSONKey'
                description: リネーム後のボディのキー
    QueryParamKey:
      type: string
      description: クエリパラメータのキー<br>半角英数字、ハイフン、アンダースコアのみを許可
      pattern: ^[a-zA-Z0-9-_.]+$
      maxLength: 255
    QueryParamValue:
      type: string
      description: クエリパラメータの値<br>URLエンコードされた文字列
      pattern: ^([\w\-._~!$&'()*+,;=:%]|%[0-9a-fA-F]{2})*$
      maxLength: 255
    ResponseModificationDetail:
      type: object
      properties:
        ifStatusCode:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 999
          description: 特定のステータスコードの場合に追加する
        headers:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/ResponseHeaderKey'
                description: 追加するヘッダーのキー
              value:
                $ref: '#/components/schemas/RequestHeaderValue'
                description: 追加するヘッダーの値
        json:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/JSONKey'
                description: 追加するJSONのキー
              value:
                type: string
                description: 追加するJSONの値
    OidcSummary:
      description: OIDC認証要約情報
      type: object
      allOf:
      - properties:
          id:
            type: string
            format: uuid
            description: Entityを識別するためのID
            example: b69f7bfe-1d8f-48bb-8b85-b47359366e48
          name:
            type: string
            description: OIDC認証名
            example: OidcName
            readOnly: true
    ServiceDetail:
      description: Service詳細情報
      type: object
      allOf:
      - $ref: '#/components/schemas/Service'
      - properties:
          corsConfig:
            $ref: '#/components/schemas/CorsConfig'
          objectStorageConfig:
            $ref: '#/components/schemas/ObjectStorageConfig'
    RequestRemoveDetail:
      type: object
      properties:
        headerKeys:
          type: array
          description: 削除するヘッダのキー<br>半角英数字、アンダースコア、ハイフンのみを許可
          items:
            $ref: '#/components/schemas/RequestHeaderKey'
        queryParams:
          type: array
          description: 削除するクエリパラメータのキー<br>半角英数字、アンダースコア、ハイフンのみを許可
          items:
            $ref: '#/components/schemas/QueryParamKey'
        body:
          type: array
          description: 削除するボディのキー<br>半角英数字、アンダースコア、ハイフンのみを許可
          items:
            $ref: '#/components/schemas/JSONKey'
    ResponseAllowDetail:
      type: object
      description: 許可するJSONのキー<br>半角英数字、ハイフン、アンダースコア、ピリオド繋ぎを許可
      properties:
        jsonKeys:
          type: array
          items:
            $ref: '#/components/schemas/JSONKey'
    ResponseReplaceDetail:
      type: object
      properties:
        ifStatusCode:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 999
          description: 特定のステータスコードの場合に置換する
        headers:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/ResponseHeaderKey'
                description: 置換するヘッダーのキー
              value:
                $ref: '#/components/schemas/RequestHeaderValue'
                description: 置換後のヘッダーの値
        json:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/JSONKey'
                description: 置換するJSONのキー
              value:
                type: string
                description: 置換後のJSONの値
        body:
          type: string
          description: 置換するボディ
    ObjectStorageConfig:
      description: Object Storage設定
      type: object
      allOf:
      - properties:
          bucketName:
            type: string
            description: バケット名
            example: my-bucket
            pattern: ^[a-z0-9.\-]*$
          folderName:
            type: string
            description: フォルダ名
            example: my-folder
            pattern: ^[a-zA-Z0-9_\-\/!.*'()]*$
          endpoint:
            type: string
            description: S3互換のエンドポイントURL
            example: s3.example.com
          region:
            type: string
            description: S3互換のリージョン名
            example: jp-north-1
          accessKeyID:
            type: string
            description: アクセスキーID
            example: XXXXXXXXXXXXXXXX
            writeOnly: true
            x-oapi-codegen-extra-tags:
              mask: 'true'
          secretAccessKey:
            type: string
            description: シークレットアクセスキー
            example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
            writeOnly: true
            x-oapi-codegen-extra-tags:
              mask: 'true'
          useDocumentIndex:
            type: boolean
            description: ドキュメントインデックスを有効にするかどうか
            default: true
        required:
        - bucketName
        - endpoint
        - region
        - accessKeyID
        - secretAccessKey
        - useDocumentIndex
    RouteDetail:
      type: object
      allOf:
      - $ref: '#/components/schemas/Route'
      - properties:
          ipRestrictionConfig:
            $ref: '#/components/schemas/IpRestrictionConfig'
    ResponseRemoveDetail:
      type: object
      properties:
        ifStatusCode:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 999
          description: 特定のステータスコードの場合に削除する
        headerKeys:
          type: array
          description: 削除するヘッダのキー<br>半角英数字、ハイフンのみを許可
          items:
            $ref: '#/components/schemas/ResponseHeaderKey'
        jsonKeys:
          type: array
          description: 削除するJSONのキー<br>半角英数字、ハイフン、アンダースコア、ピリオド繋ぎを許可
          items:
            $ref: '#/components/schemas/JSONKey'
    ResponseRenameDetail:
      type: object
      properties:
        ifStatusCode:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 999
          description: 特定のステータスコードの場合にリネームする
        headers:
          type: array
          items:
            type: object
            description: リネームするヘッダーのキー<br>半角英数字、ハイフンのみを許可
            properties:
              from:
                $ref: '#/components/schemas/ResponseHeaderKey'
              to:
                $ref: '#/components/schemas/ResponseHeaderKey'
        json:
          type: array
          items:
            type: object
            properties:
              from:
                $ref: '#/components/schemas/JSONKey'
                description: リネームするJSONのキー
              to:
                $ref: '#/components/schemas/JSONKey'
                description: リネーム後のJSONのキー
    ServiceDetailResponse:
      description: Service情報
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceDetail'
      - properties:
          subscription:
            $ref: '#/components/schemas/ServiceSubscriptionResponse'
        required:
        - subscription
    RequestAllowDetail:
      type: object
      properties:
        body:
          type: array
          description: 許可するボディのキー<br>半角英数字、アンダースコア、ハイフンのみを許可
          items:
            $ref: '#/components/schemas/JSONKey'
    RouteAuthorizationDetailResponse:
      type: object
      properties:
        isACLEnabled:
          type: boolean
          enum:
          - true
          description: 認可設定が有効かどうか
        groups:
          type: array
          description: 認可するGroupのリスト
          items:
            $ref: '#/components/schemas/RouteAuthorization'
          minItems: 1
      required:
      - isACLEnabled
      - groups
    RequestModificationDetail:
      type: object
      properties:
        headers:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/RequestHeaderKey'
                description: 追加するヘッダのキー
              value:
                $ref: '#/components/schemas/RequestHeaderValue'
                description: 追加するヘッダの値
        queryParams:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/QueryParamKey'
                description: 追加するクエリパラメータのキー
              value:
                $ref: '#/components/schemas/QueryParamValue'
                description: 追加するクエリパラメータの値
        body:
          type: array
          items:
            type: object
            properties:
              key:
                $ref: '#/components/schemas/JSONKey'
                description: 追加するボディのキー
              value:
                type: string
                description: 追加するボディの値
    RouteAuthorization:
      type: object
      properties:
        id:
          type: string
          description: GroupのEntityを識別するためのID
          format: uuid
          example: 1183b70d-70af-4e49-8af5-2a629b5c1b30
        name:
          $ref: '#/components/schemas/Name'
          description: Group名 <br> Group名はUnicode文字、数字、ハイフン、アンダースコア、ピリオド、チルダのみ許可
          example: group1
        enabled:
          type: boolean
          description: 対象の Group が許可されているかどうか
          example: true
    ResponseHeaderKey:
      type: string
      description: リクエストヘッダのキー<br>半角英数字、ハイフンのみを許可
      pattern: ^[a-zA-Z0-9-]+$
      maxLength: 255
    RequestTransformation:
      type: object
      properties:
        httpMethod:
          $ref: '#/components/schemas/HTTPMethod'
        allow:
          $ref: '#/components/schemas/RequestAllowDetail'
        remove:
          $ref: '#/components/schemas/RequestRemoveDetail'
        rename:
          $ref: '#/components/schemas/RequestRenameDetail'
        replace:
          $ref: '#/components/schemas/RequestModificationDetail'
        add:
          $ref: '#/components/schemas/RequestModificationDetail'
        append:
          $ref: '#/components/schemas/RequestModificationDetail'
    RequestHeaderValue:
      type: string
      description: リクエストヘッダの値<br>ASCII文字のみを許可
      pattern: ^[\x20-\x7E]*$
      maxLength: 255
    RequestHeaderKey:
      type: string
      description: リクエストヘッダのキー<br>半角英数字、ハイフン、アンダースコアのみを許可
      pattern: ^[a-zA-Z0-9-_]+$
      maxLength: 255
    ServiceSubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: サブスクリプションID
          example: 7c8d78bc-e4a3-4600-b70a-f5fe802dc1ba
        name:
          type: string
          description: サブスクリプション名
          example: example-subscription-1
      required:
      - id
      - name
    ServiceDetailRequest:
      description: Service登録リクエスト
      type: object
      allOf:
      - $ref: '#/components/schemas/ServiceDetail'
      - properties:
          subscription:
            $ref: '#/components/schemas/ServiceSubscriptionRequest'
        required:
        - subscription
    ResponseTransformation:
      type: object
      properties:
        allow:
          $ref: '#/components/schemas/ResponseAllowDetail'
        remove:
          $ref: '#/components/schemas/ResponseRemoveDetail'
        rename:
          $ref: '#/components/schemas/ResponseRenameDetail'
        replace:
          $ref: '#/components/schemas/ResponseReplaceDetail'
        add:
          $ref: '#/components/schemas/ResponseModificationDetail'
        append:
          $ref: '#/components/schemas/ResponseModificationDetail'
    ServiceSubscriptionRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: サブスクリプションID
          example: 7c8d78bc-e4a3-4600-b70a-f5fe802dc1ba
      required:
      - id
    Domain:
      type: object
      allOf:
      - $ref: '#/components/schemas/Model'
      - properties:
          domainName:
            type: string
            description: ドメイン名<br>ドメイン名はドメイン名形式を指定する<br>IPv4アドレス及びワイルドカード（*）を指定できない<br>大文字を含めることはできない
            example: example.com
            pattern: ^\s*(([a-z\d]([a-z\d-]*[a-z\d])?)\.)+([a-z\d-]{2,})(\.)?\s*$
          certificateId:
            type: string
            format: uuid
            description: 証明書のID
            example: 1183b70d-70af-4e49-8af5-2a629b5c1b30
          certificateName:
            type: string
            description: 証明書の識別名
