  /servers/{server_id}/raid_status/:
    get:
      tags:
      - セキュリティ
      summary: サーバーのRAID状態を取得
      description: 'サーバーのRAID状態を取得

        サーバー本体の電源が入っている必要があります'
      parameters:
      - $ref: '#/components/parameters/server_id'
      - in: query
        name: refresh
        required: false
        description: 実機の最新状態を取得
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  raid_status:
                    type: object
                    properties:
                      overall_status:
                        type:
                        - string
                        - 'null'
                        enum:
                        - ok
                        - rebuilding
                        - degraded
                        - failed
                        description: '総合的なRAID論理ボリューム状態


                          * `ok` - 全てのRAID論理ボリュームと物理デバイスが正常

                          * `rebuilding` - 再構築中のRAID論理ボリュームが1つ以上ある(物理デバイスは全て正常、冗長性は低下している)

                          * `degraded` - 異常検出した物理デバイスが1つ以上ある(論理ボリュームは利用可能、冗長性は低下している)

                          * `failed` - 故障したRAID論理ボリュームが1つ以上ある(2つ以上の物理デバイスに異常があるRAID5など)

                          * `null` - RAID論理ボリュームがない


                          `failed > degraded > rebuilding > ok` の順でより深刻なものが選択される'
                      monitored:
                        type: string
                        format: date-time
                        description: RAID状態を取得した時刻
                      logical_volumes:
                        type: array
                        description: 作成済みRAID論理ボリュームのリスト
                        items:
                          type: object
                          properties:
                            volume_id:
                              type: string
                              description: このサーバーのRAID論理ボリュームの一意な識別子
                            status:
                              type: string
                              enum:
                              - ok
                              - rebuilding
                              - degraded
                              - failed
                              description: このRAID論理ボリュームの状態
                            raid_level:
                              type: string
                              description: RAIDレベル
                            physical_device_ids:
                              type: array
                              items:
                                type: string
                                description: この論理ボリューム内の認識済みデバイスの識別子
                                example: '1'
                      physical_devices:
                        description: 認識済み物理ストレージデバイスのリスト
                        type: array
                        items:
                          type: object
                          properties:
                            device_id:
                              type: string
                              description: サーバーの物理ストレージデバイスの一意な識別子
                              example: '1'
                            slot:
                              type: integer
                              description: 接続スロット番号
                            status:
                              type: string
                              enum:
                              - ok
                              - failed
                              description: 'この物理ストレージデバイスの状態


                                * `ok` - 正常

                                * `failed` - 異常を検知'
        '401':
          $ref: '#/components/responses/generic_401'
        '404':
          description: サーバーが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/problem_details_404'
