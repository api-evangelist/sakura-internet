              - $ref: '#/components/schemas/CommonServiceItemDestinationSettings'
              - $ref: '#/components/schemas/CommonServiceItemGroupSettings'
              - $ref: '#/components/schemas/CommonServiceItemRoutingSettings'
            ServiceClass:
