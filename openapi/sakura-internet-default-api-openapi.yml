              - cloud/saknoticegroup/2
              - cloud/saknoticerouting/2
          required:
          - Name
          - Description
          - Tags
          - Icon
          - Provider
          - Settings
          - ServiceClass
      required:
      - CommonServiceItem
    CommonServiceItemRoutingSettings:
      type: object
