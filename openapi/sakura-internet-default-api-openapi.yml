            指定値と実際のユニット数の対応は次の通りです。

            - 3: 1/3ユニット

            - 7: 2/3ユニット

            - 10 ～ 660: 1 ～ 66ユニット（※）


            ※ 10 以上を指定する場合は、作成したいユニット数 × 10 の値を指定してください。指定できるのは 10 の倍数のみです。11 など 10 の倍数でない値を指定した場合はエラーとなります。'
