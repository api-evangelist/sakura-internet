          pattern: ^[0-9]{1,12}$
          type: string
        TargetGroupID:
          pattern: ^[0-9]{1,12}$
          type: string
        PriorityRank:
          maximum: 100
          minimum: 1
          type: integer
          readOnly: true
      required:
      - SourceID
      - MatchLabels
      - TargetGroupID
      - PriorityRank
