          description: Azure AI SearchのSKUのBicepパラメータ用文字列
          readOnly: true
        replicaCount:
          maximum: 12
          minimum: 1
          type: integer
          description: 'AI Searchのレプリカ数を指定します。

            選択したSKUに応じて、指定可能な値は次の通りです。

            - 1: 全SKUで指定可能

            - 2, 3: Free 以外のSKUで指定可能

            - 4 ～ 12: Free、Basic 以外のSKUで指定可能'
          format: int32
        partitionCount:
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '6'
          - '12'
          type: integer
          description: 'AI Searchのパーティション数を指定します。

            指定できる値は 1, 2, 3, 4, 6, 12 のいずれかです。

            選択したSKUに応じて、指定可能な値は次の通りです。

            - 1: 全SKUで指定可能

            - 2, 3: Free 以外のSKUで指定可能

            - 4, 6, 12: Free、Basic、Standard3HD 以外のSKUで指定可能


            また、レプリカ数 × パーティション数は次の範囲にしてください。

            - 1: SKUにFreeを指定する場合

            - 1 ～ 9: SKUにBasicを指定する場合

            - 1 ～ 36: Free、Basic 以外のSKUを指定する場合'
          format: int32
      additionalProperties: false
      description: 検索機能の作成APIで受信するリクエストボディ
