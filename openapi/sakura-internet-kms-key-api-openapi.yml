    - url: https://secure.sakura.ad.jp/cloud/zone/tk1a/api/cloud/1.1
      description: 東京第1ゾーン
    - url: https://secure.sakura.ad.jp/cloud/zone/tk1b/api/cloud/1.1
      description: 東京第2ゾーン
  /kms/keys/{resource_id}:
    get:
      operationId: readKey
      parameters:
      - in: path
        name: resource_id
        schema:
          type: string
          title: リソースID
        required: true
      tags:
      - kms-key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedKey'
          description: ''
      summary: Read key
      x-summary-source: derived
    put:
      operationId: updateKey
      parameters:
      - in: path
        name: resource_id
        schema:
          type: string
          title: リソースID
        required: true
      tags:
      - kms-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrappedKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedKey'
          description: ''
      summary: Update key
      x-summary-source: derived
    delete:
      operationId: deleteKey
      parameters:
      - in: path
        name: resource_id
        schema:
          type: string
          title: リソースID
        required: true
      tags:
      - kms-key
      responses:
        '204':
          description: No response body
      summary: Delete key
      x-summary-source: derived
    servers:
    - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/cloud/1.1
      description: 石狩第1ゾーン
    - url: https://secure.sakura.ad.jp/cloud/zone/is1b/api/cloud/1.1
