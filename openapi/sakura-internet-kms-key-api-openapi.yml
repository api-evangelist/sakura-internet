openapi: 3.2.0
info:
  title: Sakura Internet Kms Key API
  version: 1.2.0
  description: 'Operations tagged kms-key across 2 of this provider''s published API definitions: security-encryption-api.yaml, sakura-internet-security-encryption-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/cloud/1.1
  description: 石狩第1ゾーン
- url: https://secure.sakura.ad.jp/cloud/zone/is1b/api/cloud/1.1
  description: 石狩第2ゾーン
- url: https://secure.sakura.ad.jp/cloud/zone/is1c/api/cloud/1.1
