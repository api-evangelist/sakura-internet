- url: https://secure.sakura.ad.jp/cloud/zone/tk1a/api/cloud/1.1
  description: 東京第1ゾーン
- url: https://secure.sakura.ad.jp/cloud/zone/tk1b/api/cloud/1.1
  description: 東京第2ゾーン
security:
- basicAuth: []
tags:
- name: kms-key
paths:
  /kms/keys:
    get:
      operationId: listKeys
      parameters:
      - name: Count
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: From
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - kms-key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKeyList'
          description: ''
      summary: List keys
      x-summary-source: derived
    post:
      operationId: createKey
      tags:
      - kms-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrappedCreateKeyRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedCreateKeyResponse'
          description: ''
      summary: Create key
      x-summary-source: derived
    servers:
    - url: https://secure.sakura.ad.jp/cloud/zone/is1a/api/cloud/1.1
      description: 石狩第1ゾーン
    - url: https://secure.sakura.ad.jp/cloud/zone/is1b/api/cloud/1.1
      description: 石狩第2ゾーン
    - url: https://secure.sakura.ad.jp/cloud/zone/is1c/api/cloud/1.1
