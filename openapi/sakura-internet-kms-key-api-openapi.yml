components:
  schemas:
    WrappedChangeKeyState:
      type: object
      properties:
        Key:
          $ref: '#/components/schemas/ChangeKeyState'
        is_ok:
          type: boolean
          example: true
      required:
      - Key
      - is_ok
    WrappedCreateKeyResponse:
      type: object
      properties:
        Key:
          $ref: '#/components/schemas/CreateKeyResponse'
        is_ok:
          type: boolean
          example: true
      required:
      - Key
      - is_ok
    WrappedKey:
      type: object
      properties:
        Key:
          $ref: '#/components/schemas/Key'
        is_ok:
          type: boolean
          example: true
      required:
      - Key
      - is_ok
    CreateKeyResponse:
      type: object
      description: 鍵の作成結果
      properties:
        ID:
          type: string
          readOnly: true
          example: '110000000000'
        CreatedAt:
          $ref: '#/components/schemas/DateTime'
        ModifiedAt:
          $ref: '#/components/schemas/DateTime'
        ServiceClass:
          enum:
          - cloud/kms/key
          - cloud/kms/key/legacy
          type: string
          description: '* `cloud/kms/key` - 通常

            * `cloud/kms/key/legacy` - レガシー'
          x-spec-enum-id: cdc4cc214c741297
          readOnly: true
          title: サービスクラス
        Name:
          type: string
          title: 名前
          maxLength: 255
        Description:
          type: string
          title: 説明
        KeyOrigin:
          enum:
          - generated
          - imported
          type: string
          description: '* `generated` - 生成

            * `imported` - インポート'
          x-spec-enum-id: ce5bfb1ae3eae901
          readOnly: true
          title: 鍵の生成元
        LatestVersion:
          type: integer
          readOnly: true
          example: 0
        Status:
          enum:
          - active
          - restricted
          - suspended
          - pending_destruction
          - destroyed
          type: string
          description: '* `active` - 有効

            * `restricted` - 制限付き

            * `suspended` - 一時停止

            * `pending_destruction` - 削除保留

            * `destroyed` - 削除済み'
          x-spec-enum-id: 16d501464180eaec
          readOnly: true
          title: 鍵の状態
        DeletionScheduledAfter:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          title: 削除予定日時
          description: この日時以降に削除される予定です
          example: '2025-02-05T12:19:22.551827+09:00'
        Tags:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
      required:
      - CreatedAt
      - Description
      - ID
      - KeyOrigin
      - LatestVersion
      - ModifiedAt
      - Name
      - ServiceClass
      - Status
      - Tags
    PaginatedKeyList:
      type: object
      required:
      - Count
      - From
      - Total
      - Keys
      - is_ok
      properties:
        Count:
          type: integer
          example: 10
        From:
          type: integer
          example: 0
        Total:
          type: integer
          example: 10
        Keys:
          type: array
          items:
            $ref: '#/components/schemas/Key'
        is_ok:
          type: boolean
          example: true
    WrappedCreateKeyRequest:
