openapi: 3.2.0
info:
  title: AppRun専有型 Service Class API
  version: 1.4.0
  contact:
    name: SAKURA internet Inc.
  license:
    name: Copyright(C) SAKURA internet Inc. all rights reserved.
  description: '# 更新履歴


    - 2026-07-29 (v1.4.0): クラスタのロードバランサ設定取得・更新エンドポイントを追加

    - 2026-07-15 (v1.3.1): Response samplesを修正


    ---


    「AppRun専有型」が提供する API の利用方法とサンプルを公開しています。


    # 基本的な使い方


    ## APIキーの発行


    API を利用するには、認証用の「APIキー」が必要です。事前にキーを発行してください。\

    APIキーは、「ユーザーID」「パスワード」に相当する「トークン」と呼ばれる認証情報で構成されています。


    | 項目名 | APIキー発行時の項目名 | このドキュメント内での例 |

    |--------|----------------------|--------------------------|

    | ユーザーID | アクセストークン (UUID) | 01234567-89ab-cdef-0123-456789abcdef |

    | パスワード | アクセストークンシークレット |…'
servers:
- url: https://secure.sakura.ad.jp/cloud/api/apprun-dedicated/1.0
  description: AppRun専有型 API エンドポイント
  variables: {}
security:
- BasicAuth: []
tags:
- name: service_class
paths:
  /service_classes/lb:
    get:
      operationId: listLoadBalancerServiceClasses
      summary: ロードバランササービスクラスの一覧を取得
      description: ロードバランササービスクラスの一覧を返します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLoadBalancerServiceClassesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - service_class
  /service_classes/worker:
    get:
      operationId: listWorkerServiceClasses
      summary: ワーカノードサービスクラスの一覧を取得
      description: ワーカノードサービスクラスの一覧を返します。
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkerServiceClassesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - service_class
components:
  schemas:
    Error:
      type: object
      required:
      - status
      - title
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
    ListLoadBalancerServiceClassesResponse:
      type: object
      required:
      - lbServiceClasses
      properties:
        lbServiceClasses:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancerServiceClass'
          description: ロードバランササービスクラスの一覧
      example:
        lbServiceClasses:
        - name: 1vCPU / 2GB メモリ * 1 (非冗長構成)
          nodeCount: 1
          path: cloud/apprun/dedicated/lb/1vcpu_2gb_1
        - name: 1vCPU / 2GB メモリ * 2 (冗長構成)
          nodeCount: 2
          path: cloud/apprun/dedicated/lb/1vcpu_2gb_2
        - name: 4vCPU / 4GB メモリ * 2 (冗長構成)
          nodeCount: 2
          path: cloud/apprun/dedicated/lb/4vcpu_4gb_2
    WorkerServiceClass:
      type: object
      required:
      - path
      - name
      properties:
        path:
          type: string
          description: サービスクラスのパス
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: サービスクラスの名前
    ListWorkerServiceClassesResponse:
      type: object
      required:
      - workerServiceClasses
      properties:
        workerServiceClasses:
          type: array
          items:
            $ref: '#/components/schemas/WorkerServiceClass'
          description: ワーカノードサービスクラスの一覧
      example:
        workerServiceClasses:
        - name: 1vCPU / 2GB メモリ
          path: cloud/apprun/dedicated/worker/1vcpu_2gb
        - name: 2vCPU / 2GB メモリ
          path: cloud/apprun/dedicated/worker/2vcpu_2gb
        - name: 2vCPU / 4GB メモリ
          path: cloud/apprun/dedicated/worker/2vcpu_4gb
        - name: 4vCPU / 8GB メモリ
          path: cloud/apprun/dedicated/worker/4vcpu_8gb
    LoadBalancerServiceClass:
      type: object
      required:
      - path
      - nodeCount
      - name
      properties:
        path:
          type: string
          description: サービスクラスのパス
        nodeCount:
          type: integer
          format: int16
          description: 割り当てられるノード数
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: サービスクラスの名前
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
externalDocs:
  url: https://manual.sakura.ad.jp/cloud/apprun-dedicated/releasenote.html
  description: リリースノート | さくらのクラウド マニュアル
